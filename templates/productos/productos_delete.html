
{% extends 'base/base.html' %}

{% block title %}Eliminar producto | Kiosco{% endblock %}

{% block content %}
<h2>Eliminar producto</h2>

<p>¿Seguro que querés eliminar el producto
    <strong>{{ producto.nombre }}</strong>?
</p>

<p>Esta acción no se puede deshacer.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a class="boton secundario" href="{% url 'productos:detalle' producto.pk %}">Cancelar</a>
</form>
{% endblock %}
