{% extends 'base/base.html' %}

{% block title %}Editar producto | Kiosco{% endblock %}

{% block content %}
<h2>Editar producto</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Guardar cambios</button>
    <a class="boton secundario" href="{% url 'productos:detalle' producto.pk %}">Cancelar</a>
</form>
{% endblock %}
