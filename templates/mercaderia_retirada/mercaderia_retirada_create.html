
{% extends 'base/base.html' %}

{% block title %}Registrar retiro | Kiosco{% endblock %}

{% block content %}
<h2>Registrar retiro de mercadería</h2>

<p>
    Registrá el producto, la cantidad retirada y el motivo.
</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Registrar retiro</button>
    <a class="boton secundario"
       href="{% url 'mercaderia_retirada:lista' %}">
        Cancelar
    </a>
</form>
{% endblock %}
