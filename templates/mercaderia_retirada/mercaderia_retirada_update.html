
{% extends 'base/base.html' %}

{% block title %}Editar retiro | Kiosco{% endblock %}

{% block content %}
<h2>Editar registro de retiro</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Guardar cambios</button>
    <a class="boton secundario"
       href="{% url 'mercaderia_retirada:detalle' object.pk %}">
        Cancelar
    </a>
</form>
{% endblock %}
